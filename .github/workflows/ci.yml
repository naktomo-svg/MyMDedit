# The verification CLAUDE.md asks of every change.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo build
      # main.rs's test inspects the binary `cargo build` produced.
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check
      - run: cargo fmt --check
        working-directory: fuzz

  deny:
    # Dependency policy and notices. cargo-deny-action runs in a Linux container; the policy itself is target-independent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # THIRD-PARTY-NOTICES.txt ships in the release zip; it must match Cargo.lock.
      - run: cargo about generate about.hbs -o THIRD-PARTY-NOTICES.txt && git diff --exit-code THIRD-PARTY-NOTICES.txt
